<svg xmlns="http://www.w3.org/2000/svg" width="220" height="140" viewBox="0 0 220 140" fill="none" role="img" aria-label="SuiteOcean">
  <rect width="220" height="140" fill="#203c6c"/>
  <!-- Mark: compact, left; optically centered with type -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(14, 44) scale(0.7)">
    <path d="M0 18 C 14 38, 28 38, 40 18 C 52 -2, 66 -2, 80 18" stroke="#d59a4d" stroke-width="12"/>
    <path d="M0 42 C 14 62, 28 62, 40 42 C 52 22, 66 22, 80 42" stroke="#edd3ad" stroke-width="12"/>
  </g>
  <!-- Type block vertically centered in 140px (baseline for 17px title ~ y=66, subtitle with room for descenders) -->
  <text
    x="86"
    y="64"
    fill="#ffffff"
    font-family="Helvetica, Arial, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="-0.25"
  >SuiteOcean</text>
  <text
    x="86"
    y="82"
    fill="#edd3ad"
